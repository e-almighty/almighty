# USDJPY 自動テクニカル分析 — 解析の設定
# 値を変えたらここだけ直す（コードには埋め込まない）。
# STEP 3 で SHO が「線の引き方」を見て調整する前提の初期値。

symbol: USDJPY            # 表示名
pip: 0.01                 # 1pip の値（USDJPY = 0.01）
timezone: Asia/Tokyo      # 表示に使う時刻

timeframes:
  4h:
    label: 4時間足
    bars_to_analyze: 300  # 解析に使う本数（約50日）
    bars_to_plot: 120     # 画像に描く本数（約20日）
    pivot_left: 5         # スイング判定：左側に何本の足より高い／低いか
    pivot_right: 5        # スイング判定：右側に何本の足より高い／低いか（確定に必要）
    atr_period: 14
    cluster_atr_mult: 0.6 # サポレジのまとめ幅 = ATR × この値（近い高安を1本にまとめる）
    min_separation_atr: 1.0 # 表示するライン同士の最小間隔（ATR 倍）
    max_support: 3        # 表示するサポートの最大本数
    max_resistance: 3     # 表示するレジスタンスの最大本数
    ema_fast: 20
    ema_slow: 50
    ema_long: 200         # 大局を見る線（SHO の指定・2026-10-04：20・50・200 の 3 本）
    channel_far_point: extreme  # 平行線の決め方：extreme=期間内の最も離れた高値/安値（ヒゲ含む）、pivot=確定スイングだけ
    trendline_candidates: 6     # チャネルの基準線（トレンドライン）候補に使う直近スイングの数
    trendline_tolerance_atr: 0.3 # ラインに「触れた」とみなす幅（ATR 倍）
    trendline_min_touches: 2     # 2点で引き、3点目があれば「有効性あり」
    trendline_max_broken_age: 10 # ブレイクからこの本数より経った線は描かない（直近のブレイクだけ報告）
    trendline_max_distance_atr: 6 # 線の現在値が現在値から ATR × この値より離れていたら描かない
    round_number_step: 0.5       # 心理的節目の間隔（XX0.00 と XX5.00 → 0.5円刻み）
    major_swing_atr: 2.0         # 主要スイング：直前の反対側スイングからの振幅が ATR × この値 以上（ダウ理論・フィボ・構造はこれを使う）
    rsi_period: 14               # RSI の期間（ダイバージェンス判定とサブパネル）

higher_timeframe:
  1D:
    ema: 50               # 日足の大局判定に使う EMA（Phoenix 5分足版のゲートと同じ 50）
    atr_period: 14        # 日足 ATR（1 日の値幅の目安）

# 相場環境の判定（スコア方式）。しきい値は STEP 3 で調整する
trend:
  strong_threshold: 3     # スコアがこれ以上なら「強い上昇」「強い下落」
  weak_threshold: 2       # スコアがこれ以上なら「弱い上昇」「弱い下落」。それ未満はレンジ
  ema_slope_bars: 10      # EMA の傾きを見る本数
  ema_slope_atr: 0.2      # 傾きが ATR × この値を超えたら「上向き／下向き」

output:
  image_width_px: 1600
  image_height_px: 900
  dpi: 100
  daily_image: true              # 2 枚目：日足（EMA50・前週高安・押し安値だけ）。X には本体に 2 枚添付
  daily_months: 6                # 日足に描く期間（か月）
  daily_image_morning_only: true # 夜は朝と同じ日足なので作らない（リサーチ 9 章の 7）

# 画像の見た目（SHO の指定・2026-10-04：サポート＝赤、レジスタンス＝緑、太くはっきり）
chart:
  support_color: "#d62828"
  resistance_color: "#1b9e4b"
  level_linewidth: 2.8
  level_label_size: 11
  channel_color: "#6a1b9a"        # チャネルの上限・下限（紫）
  channel_center_color: "#b39ddb" # チャネルの中央線（薄い紫・破線）
  channel_linewidth: 1.8
  ema_fast_color: "#f39c12"       # EMA20 = 橙
  ema_slow_color: "#2980b9"       # EMA50 = 青
  ema_long_color: "#111111"       # EMA200 = 黒（SHO の指定・2026-10-04）
  ema_long_width: 2.4             # EMA200 は太め
  # 画像はシンプルに（SHO 2026-10-04「ガチャガチャしすぎ」）：ローソク足・EMA 3 本・サポレジ・チャネル・押し安値・RSI だけ
  draw_fib: false                 # 主波のフィボ 38.2／50／61.8（金の細い破線）。fibonacci.enabled も true が必要
  draw_key_level: true            # 押し安値／戻り高値を点線で描く（ダウ理論の分かれ目）
  draw_prev_day: false            # 前日高安（灰の破線）。解説文には残る
  draw_zones: true                # 注目価格帯の薄い帯（2026-10-07：上下 1 つずつだけに戻す。SHO が「多い」と言えば false）
  zones_draw_each_side: 1         # 帯を上下いくつ描くか
  # 画像の仕上げ（リサーチ 9 章の 6・7、SHO 2026-10-07「タイトルが刺さるように」）
  title_band: true                # 上端の帯に投稿の 1 行目（【今日のドル円】… が分かれ目）を焼き込む
  title_band_color: "#1f2a44"
  footer_hook: true               # 最下段に 🔑 結論 1 行（絵文字の無いフォントでは「結論」の札）
  footer_color: "#fff6d5"
  draw_scenario_arrows: true      # メイン＝実線の矢印、サブ＝点線の矢印、崩れる価格＝赤の点線に短い文字
  evening_overlay: true           # 夜：朝のプランの帯と、朝以降の実際の高値／安値を塗り足す
  draw_rsi_panel: true            # RSI をチャートの下に出し、ダイバージェンスの線を引く
  draw_divergence: true           # 価格側にもダイバージェンスの線を引く
  fib_color: "#c8a000"
  key_level_color: "#8e2d2d"
  prev_day_color: "#888888"
  zone_above_color: "#1b9e4b"     # 上の注目帯（レジスタンス側＝緑）
  zone_below_color: "#d62828"     # 下の注目帯（サポート側＝赤）
  zone_alpha: 0.10
  rsi_color: "#5b2c6f"
  divergence_color: "#00897b"     # ダイバージェンスの斜線（青緑。EMA20 の橙と見分ける）

# ---- 第2ステージ（2026-10-04 追加）：確定足・ダウ理論・フィボ・RSI・SQZMOM・注目価格帯 ----

# 判定幅の一元管理（「触れた」「割った」をどこまで許すか。モジュールごとにばらつかせない）
tolerances:
  structure_break_atr: 0.1    # ダウ理論：押し安値（戻り高値）を終値で ATR × この値 以上割ったら「崩れ」
  structure_basis: close      # close＝終値で判定（既定）／wick＝ヒゲ（主要安値そのもの）で判定
  zone_merge_atr: 0.4         # 注目価格帯：根拠同士の価格差が ATR × この値 以内なら 1 つの帯にまとめる
  reach_atr: 0.3              # 「到達した」とみなす幅（答え合わせ・前回の線への反応）

fibonacci:
  enabled: false              # SHO 2026-10-04「フィボナッチは抜いてシンプルに」→ 既定 OFF。true にすると解説・注目価格帯・画像に戻る
  wave: chart_major           # 主波（リトレースメント用）の取り方：chart_major＝画像に写る範囲で最も大きな波（既定）
                              #   structure＝ダウ理論と同じ波（押し安値→更新対象の高値）／last_impulse＝主要スイングの最後の推進波
  levels: [0.236, 0.382, 0.5, 0.618, 0.786]   # リトレースメント（文章で使う比率）
  draw_levels: [0.382, 0.5, 0.618]            # 画像に描く比率（線を増やしすぎない）
  extensions: [1.0, 1.618]                    # 直近波の目標（3 点方式：押しの極値 ＋ 波幅 × 比率。1.0＝N 計算値）
  projections: [1.272, 1.618]                 # 主波を伸ばした中期の目安（2 点方式：起点 ＋ 波幅 × 比率）。文章のみ
  min_wave_atr: 3.0                           # 波の大きさが ATR × この値 未満なら引かない

divergence:
  swings: minor               # minor＝左右 5 本の確定ピボット（TradingView の標準と同じ）／major＝主要スイング
  min_price_atr: 0.3          # 価格の差が ATR × この値 以上
  min_rsi_diff: 3.0           # RSI の差が この値 以上
  max_age_bars: 20            # 2 つ目のピボットが直近この本数以内（pivot_right＋15）
  max_span_bars: 60           # 2 つのピボットの間隔の上限（TradingView の Divergence Indicator の既定 60 と同じ）
  hidden: true                # 隠れ（ヒドゥン）ダイバージェンスも検出する

sqzmom:
  in_text: true               # 解説文に 1 行入れる（false で消える）。画像には描かない（SHO 2026-10-04）
  bb_length: 20
  bb_mult: 1.5                # LazyBear の原典は BB の偏差にも KC 側の 1.5 を使う（dev = multKC × stdev）。TradingView の表示と同じにするため 1.5
  kc_length: 20
  kc_mult: 1.5

atr_context:
  percentile_bars: 100        # 4H ATR を過去この本数の中で位置づける
  low_pct: 30                 # これ未満なら「低め」
  high_pct: 70                # これ超なら「高め」

zones:                        # 注目価格帯（根拠の重なり）
  max_each_side: 2
  weights:                    # 根拠ごとの重み。合計点で格付けする
    level: 2.0                # サポレジ（＋反応回数 × 0.1、上限 1.0）
    fib_main: 1.5             # フィボ 38.2／50／61.8
    fib_other: 0.8            # フィボ 23.6／78.6
    fib_ext: 1.0              # エクステンション
    channel_edge: 1.2         # チャネル上限・下限
    channel_center: 0.8
    ema_fast: 0.8
    ema_slow: 1.0
    ema_long: 1.5
    daily_ema: 1.3            # 日足 EMA50
    prev_day: 1.2             # 前日高安
    prev_day_close: 0.6
    prev_week: 1.3            # 前週高安
    key_level: 1.5            # 押し安値／戻り高値（ダウ理論）
    round_number: 0.5         # XX0.00（現在値から ATR × 4 以内のものだけ）

posting:                      # 投稿の型
  morning_slot_hour_end: 15   # この時（JST）より前の実行は「朝のプラン」、以降は「中間報告」（--slot auto）
  x_max_units: 1650           # X の文字数上限（全角 2・半角 1 で数える）。SHO はブルー認証なので 280 にこだわらず、
                              # 「短い形の約 4 倍・ほどほど」（2026-10-04）→ 目安 1,300〜1,600、上限 1,650（タイトル 4 行＋本文＋ハッシュタグ 10 個）。超えたら優先度の低い行から落とす
  post_style: thread          # SHO 決定 2026-10-05：第 1 案（短い本体＋返信 2 投）で試す。long＝1 本の長文（並びは layout）／short＝6 行（280 向け）
  layout: scenario_first      # long のときの並び：scenario_first＝分かれ目→シナリオ→注目帯→環境…→根拠（第 2 案）／classic＝環境→構造→…→シナリオ
  reply_max_units: 1000       # thread の返信 1 投あたりの上限
  answer_check: true          # 答え合わせ（SHO 決定 2026-10-05）：夜は「朝のプラン」を ✅ 2〜3 行、朝は「昨夜のプラン」を 1 行。台帳の前回シナリオと確定足で機械判定
  evening_quote_morning: true # 夜の投稿は朝の投稿を「引用」して出す（SHO 決定 2026-10-05。投稿プログラム側で使う。台帳の post_id を参照）
  title:                      # 投稿の頭（SHO 2026-10-04「タイトル → チャート → 説明」。難しい言葉より「今日のドル円」）
    morning: "【今日のドル円】{date} 朝のプラン｜{hook_short}"   # {date}=10/04(日)・{hook_short}=158.00 が分かれ目・{slot}・{symbol}・{timeframe}
    evening: "【今日のドル円】{date} 夜の中間報告｜{hook_short}"  # 夜の {hook_short} は答え合わせ：朝の 158.00 は抜けず／を抜けた／朝の見立ては崩れ
    tagline: "ドル円だけを毎日2回、確定足で機械的に分析"   # 2 行目の一言。空文字 "" で消える
    hook: true                # 🔑 結論 1 行（どこを抜けたら・割ったらどうなるか）を 📊 の次に出す
  next_note:                  # 本文末の「次の投稿」案内（空にすると出ない）
    morning: "→ 20:05 に同じチャートで答え合わせします"
    evening: ""
  hashtags:                   # SHO 決定 2026-10-05：リサーチの推奨どおり 2 個（X 公式ヘルプ「2 個以内」、おすすめ欄の点数にタグ項目なし、多タグはスパム判定の側）
    - "#ドル円"
    - "#USDJPY"
  # 10 個案（SHO 2026-10-04 の希望。2026-10-05 に 2 個へ）：#ドル円 #USDJPY #FX #為替 #テクニカル分析 #チャート分析 #環境認識 #FX初心者 #相場分析 #投資

ledger:
  enabled: true               # 前回の結果を output/state に残し、次回「変化点」「前回の線への反応」を書く
