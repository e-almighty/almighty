<!doctype html>
<meta charset="utf-8">
<!-- ============================================================
     動画スライド テンプレート（1920×858）

     ★これは「1枚だけ、手元で見た目を試す」ためのファイルです。
       ここを書き換えても、動画のスライドには反映されません。
       実際のスライドは ツール/make_slides.py の STYLE を見て作られます。

     使い方：
       ① 下の【設定】を変えて、ブラウザで開いて見た目を確かめる
       ② 気に入ったら、その値を make_slides.py の STYLE に書き写す
       ③ python3 ツール/make_slides.py script.json で全シーンぶん作る

     ・この1920×858は、動画の上側だけです。
       下の222pxは動画側で字幕の帯になります（このファイルには含みません）
     ============================================================ -->
<style>
:root {
  /* ▼【設定】ここだけ変えてください ▼ */
  --bg:      #0f1830;   /* 背景色 */
  --text:    #ffffff;   /* 文字色 */
  --accent:  #ffb02e;   /* アクセント色（1色だけ） */
  --font:    "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  --h-size:  86px;      /* 見出しの大きさ */
  /* ▲ ここまで ▲ */

  --b-size: 52px;      /* 箇条書きの大きさ */
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  width:1920px; height:858px; background:var(--bg); color:var(--text);
  font-family:var(--font);
  /* スライドは 1920×858。下222pxは動画側で字幕帯になります */
  padding:70px 140px;
  display:flex; flex-direction:column; justify-content:center;
}
h1 {
  font-size:var(--h-size); font-weight:800; line-height:1.3;
  margin-bottom:70px; padding-left:36px;
  border-left:16px solid var(--accent);
}
ul { list-style:none; }
li {
  font-size:var(--b-size); line-height:1.9; margin-bottom:28px;
}
li::before { content:"▸ "; color:var(--accent); }
</style>

<!-- ▼ ここに台本の「見出し」と「箇条書き」を入れる ▼ -->
<h1>申請には期限があります</h1>
<ul>
  <li>原則は「14日以内」</li>
  <li>1日でも過ぎたら原則NG</li>
  <li>郵送は消印ではなく到着日</li>
</ul>
